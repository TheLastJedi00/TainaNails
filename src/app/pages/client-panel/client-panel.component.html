<header>
  <button mat-raised-button [routerLink]="['']" color="accent">Início</button>
</header>
<section>
  <div *ngIf="schedulesList.length === 0 && !isLoading" class="container">
    <img src="../../../assets/Logotype.svg" alt="Tainá Lima Nail Design" />
    <span
      >Seu código é a primeira letra do seu nome e os 4 últimos dígitos do seu
      telefone.</span
    >
    <mat-form-field [formGroup]="codeForm" class="input">
      <mat-label>Seu Código</mat-label>
      <input matInput placeholder="A1234" required formControlName="code" />
      <mat-error
        *ngIf="codeForm.get('code')?.invalid && codeForm.get('code')?.touched"
      >
        Código inválido
      </mat-error>
    </mat-form-field>
    <button
      mat-raised-button
      [disabled]="codeForm.invalid"
      color="primary"
      (click)="search()"
    >
      Buscar
    </button>
  </div>
  <div *ngIf="isLoading"><mat-spinner color="accent"></mat-spinner></div>
  <table
    *ngIf="schedulesList.length > 0"
    mat-table
    [dataSource]="schedulesList"
    class="mat-elevation-z8"
  >
    <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

    <!-- Position Column -->
    <!-- <ng-container matColumnDef="acessCode">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let s">{{ s.acessCode }}</td>
    </ng-container> -->

    <!-- Name Column -->
    <ng-container matColumnDef="clientName">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let s">{{ s.clientName }}</td>
    </ng-container>

    <!-- Weight Column -->
    <!-- <ng-container matColumnDef="clientPhone">
      <th mat-header-cell *matHeaderCellDef>Contato</th>
      <td mat-cell *matCellDef="let s">{{ s.clientPhone }}</td>
    </ng-container> -->

    <!-- Symbol Column -->
    <ng-container matColumnDef="serviceName">
      <th mat-header-cell *matHeaderCellDef>Serviço</th>
      <td mat-cell *matCellDef="let s">{{ s.serviceName }}</td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="startTime">
      <th mat-header-cell *matHeaderCellDef>Data</th>
      <td mat-cell *matCellDef="let s">{{ serverTimestampToDateString(s.startTime) }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</section>
