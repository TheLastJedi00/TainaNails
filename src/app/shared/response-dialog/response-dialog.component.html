<section *ngIf="!isLoading">
  <mat-icon style.color="{{ iconColor }}">{{ matIcon }}</mat-icon>
  <h2 mat-dialog-title>{{ title }}</h2>
  <mat-dialog-content *ngIf="description">
    <p>
      {{ description }} <strong>{{ strong }}</strong>
    </p>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-dialog-close mat-raised-button color="accent">Voltar</button>
  </mat-dialog-actions>
</section>
<section *ngIf="isLoading">
  <mat-spinner color="accent"></mat-spinner>
</section>
