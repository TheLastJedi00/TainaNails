<section>
    <div>
        <h1>Deletar Agendamento</h1>
    </div>
    <mat-dialog-content>
        <p class="warning">Tem certeza que deseja deletar este agendamento?</p>
    </mat-dialog-content>
    <mat-dialog-content>
        <p><strong>Nome:</strong> {{nameValue}}</p>
        <p><strong>Telefone:</strong> {{phoneValue}}</p>
        <p><strong>Serviço:</strong> {{serviceValue}}</p>
        <p><strong>Data:</strong> {{dateValue}}</p>
    </mat-dialog-content>
    <mat-dialog-actions class="buttons">
        <button mat-button mat-dialog-close color="primary">
        <mat-icon>cancel</mat-icon>Cancelar
        </button>
        <button mat-raised-button mat-dialog-close color="warn" (click)="deleteSchedule()">
        <mat-icon>delete</mat-icon>Deletar
        </button>
    </mat-dialog-actions>
    <mat-spinner *ngIf="isLoading" color="accent"></mat-spinner>
</section>
